<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glow Sleuth ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff5c9a;--pink:#ff8fb8;--blush:#ffe3ef;--petal:#fff5f9;--lav:#e8dcff;--lav-d:#9b7fe8;--peach:#ffe6d5;--mint:#d9f7ea;--mint-d:#1f9d6b;--ink:#5a3550;--soft:#9a7690;--shadow:0 10px 30px rgba(255,92,154,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 12% 8%,#ffd1e6 0,transparent 38%),radial-gradient(circle at 90% 12%,var(--lav) 0,transparent 35%),radial-gradient(circle at 80% 95%,var(--peach) 0,transparent 40%),linear-gradient(160deg,#fff0f6,#fdf0ff);background-attachment:fixed;overflow:hidden}
.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sparkles i{position:absolute;font-style:normal;opacity:.5;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(14deg)}}
button{font-family:inherit}
.shell{position:relative;z-index:1;display:flex;height:100dvh}

/* sidebar */
#side{width:290px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-right:2px solid #fff;box-shadow:var(--shadow)}
.side-top{display:flex;gap:8px}
.newc{flex:1;border:0;border-radius:999px;padding:11px;font:700 .95rem 'Quicksand';color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 6px 16px rgba(255,92,154,.35)}
#cs{width:100%;border:2px solid var(--blush);border-radius:999px;padding:9px 14px;font:600 .88rem 'Quicksand';color:var(--ink);outline:none;background:#fff}
#cs:focus{border-color:var(--pink)}
#clist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:0 -4px;padding:0 4px}
.ci{display:flex;gap:6px;align-items:flex-start;padding:9px 10px;border-radius:16px;cursor:pointer;border:2px solid transparent;background:#fff}
.ci:hover{border-color:var(--blush)}.ci.on{border-color:var(--pink);background:var(--petal)}
.ci .t{flex:1;min-width:0}
.ci b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{display:block;color:var(--soft);font-size:.74rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci mark{background:#ffd6e8;color:var(--rose);border-radius:4px;padding:0 2px}
.ci .del{border:0;background:none;cursor:pointer;font-size:.95rem;opacity:.35;transition:.15s}
.ci:hover .del{opacity:1}.ci .del:hover{transform:scale(1.2)}
.empty{color:var(--soft);font-weight:600;font-size:.85rem;text-align:center;padding:14px}
.mini{border:0;background:none;color:var(--lav-d);font:700 .8rem 'Quicksand';cursor:pointer;text-decoration:underline}
#overlay{display:none}
.sp{display:none}

/* main */
.app{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px 10px;max-width:920px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
#menu{display:none;border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:1.2rem;box-shadow:var(--shadow);cursor:pointer}
.logo{font-family:'Pacifico',cursive;font-size:2.1rem;margin:0;flex:1;text-align:center;background:linear-gradient(90deg,var(--rose),#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(255,255,255,.9))}
#chat{flex:1;overflow-y:auto;padding:8px 2px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:94%;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.msg.bot{align-self:flex-start;width:100%}
.bubble{display:inline-block;background:#fff;border:2px solid var(--blush);border-radius:20px 20px 20px 4px;padding:12px 16px;box-shadow:var(--shadow);line-height:1.5}
.bubble b{color:var(--rose)}
.msg.me{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;max-width:85%}
.ubub{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;padding:10px 16px;border-radius:20px 20px 4px 20px;font-weight:600;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.ubub .ph{font-size:.8rem;opacity:.9;margin-bottom:3px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-bottom:6px}
.thumbs img{height:120px;max-width:170px;object-fit:cover;border-radius:14px;border:2px solid #fff;box-shadow:0 4px 12px rgba(90,53,80,.25);cursor:zoom-in;background:#fff}
.acts{display:flex;gap:6px;margin-top:4px;opacity:0;transition:.15s}
.msg.me:hover .acts,.msg.me.editing .acts{opacity:1}
@media(hover:none){.acts{opacity:1}}
.acts button{border:0;background:#fff;border-radius:999px;padding:3px 10px;font:700 .75rem 'Quicksand';color:var(--soft);cursor:pointer;box-shadow:0 2px 8px rgba(255,92,154,.15)}
.acts button:hover{color:var(--rose)}
textarea.edit{width:min(520px,80vw);border:2px solid var(--pink);border-radius:16px;padding:10px 14px;font:600 .95rem 'Quicksand';color:var(--ink);outline:none;resize:vertical;background:#fff}
.muted{color:var(--soft);font-size:.82rem;font-weight:600}
details.trace{margin-top:8px;font-size:.84rem;color:var(--soft)}
details.trace summary{cursor:pointer;font-weight:700;color:var(--lav-d)}details.trace li{margin:2px 0}

.card{background:#fff;border:2px solid var(--blush);border-radius:24px;padding:16px;margin-top:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.first{border-color:var(--pink)}
.head{display:flex;gap:12px}
.head img{width:78px;height:78px;object-fit:contain;border-radius:16px;background:var(--petal);border:2px solid var(--blush);flex:none}
.rank{display:inline-block;background:var(--blush);color:var(--rose);font-weight:700;font-size:.78rem;padding:3px 11px;border-radius:999px}
.rank.top{background:linear-gradient(135deg,#ffd86b,#ff9ec4);color:#7a2d52}
.card h4{margin:6px 0 0;font-size:1.08rem}
.brand{color:var(--soft);font-weight:600;font-size:.85rem}
.score{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:8px 0}
.big{font-size:1.7rem;font-weight:700;color:var(--rose)}
.stars{font-size:1.05rem;letter-spacing:2px;background:linear-gradient(90deg,#ffb100 var(--p),#f0d9e4 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag-s,.tag-c{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px}
.tag-s{background:var(--lav);color:#6a4fc4}.tag-c{background:var(--mint);color:var(--mint-d)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.86rem}
td,th{padding:6px 8px;text-align:left;white-space:nowrap}
th{color:var(--soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
tr.o{border-top:1px dashed var(--blush)}tr.out td:not(:last-child){opacity:.6}
.over{background:var(--peach);color:#c0662b;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:5px}
.card:not(.all) tr.more{display:none}
.best{background:var(--mint);color:var(--mint-d);font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:5px}
.buy{color:#fff;background:var(--rose);text-decoration:none;font-weight:700;font-size:.74rem;padding:4px 11px;border-radius:999px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.86rem}
@media(max-width:560px){.pc{grid-template-columns:1fr}}
.pc div{background:var(--petal);border-radius:14px;padding:8px 12px}
.pc b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.pro b{color:var(--mint-d)}.con b{color:#e0864a}
.pc ul{margin:4px 0 0;padding-left:16px}
.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.buy.alt{background:var(--lav);color:#6a4fc4}
.why{margin:8px 0 0;padding-left:18px;font-size:.85rem;color:var(--soft);font-weight:600}

.composer{padding:6px 0 2px}
.box{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--pink);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.box input[type=text]{flex:1;border:0;outline:0;font:600 1rem 'Quicksand';color:var(--ink);padding:8px 6px;background:none;min-width:0}
.ic{border:0;cursor:pointer;width:42px;height:42px;border-radius:50%;font-size:1.2rem;flex:none;transition:.15s}
.ic:hover{transform:scale(1.08) rotate(-6deg)}
.cam{background:var(--lav)}.send{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff}
.send.busy{opacity:.5}
#preview{display:flex;gap:8px;flex-wrap:wrap;padding:0 8px 6px}
#preview .pv{position:relative}
#preview img{height:52px;border-radius:12px;border:2px solid var(--pink)}
#preview button{position:absolute;top:-6px;right:-6px;border:0;background:var(--rose);color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:.7rem}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--pink);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px)}}
.verdict{display:inline-block;font-weight:700;padding:4px 12px;border-radius:999px;margin-bottom:6px}
.v-good_match{background:var(--mint);color:var(--mint-d)}.v-caution{background:var(--peach);color:#c0662b}.v-unknown{background:var(--lav);color:#6a4fc4}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;font-weight:700;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:820px){
  #menu{display:block}
  .sp{display:block;width:42px}
  #side{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-105%);transition:transform .25s;width:min(300px,86vw);background:rgba(255,255,255,.96)}
  body.side-open #side{transform:none}
  body.side-open #overlay{display:block;position:fixed;inset:0;background:rgba(90,53,80,.35);z-index:9}
  .logo{font-size:1.8rem}
}
</style>
</head>
<body>
<div class="sparkles" id="sp"></div>
<div class="shell">
  <aside id="side">
    <div class="side-top"><button class="newc" id="newc">＋ New chat</button></div>
    <input id="cs" type="search" placeholder="🔍 Search chats…" autocomplete="off">
    <div id="clist"></div>
    <button class="mini" id="delall">Delete all chats</button>
  </aside>
  <div id="overlay"></div>

  <main class="app">
    <header>
      <button id="menu" title="Chats">☰</button>
      <h1 class="logo">Glow Sleuth ✨</h1>
      <span class="sp"></span>
    </header>
    <div id="chat"></div>
    <div class="composer">
      <div id="preview"></div>
      <div class="box">
        <button class="ic cam" id="cam" title="Check a product by photo">📸</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <input type="text" id="q" placeholder="Tell me your skin type, product & budget ✨" autocomplete="off">
        <button class="ic send" id="go" title="Send">💌</button>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
const CATALOG = __CATALOG_JSON__;
const ERR = {
  no_key:"Photo check needs a Gemini or Anthropic API key. Put GEMINI_API_KEY (or ANTHROPIC_API_KEY) in your .env file and restart the server 🔑",
  bad_key:"The AI key was rejected. Create a fresh key, put it in .env and restart the server 🔑",
  ai_error:"The AI service had a hiccup or timed out. Try again in a moment, or use a smaller photo 💗",
  no_image:"Add a photo first 📸",
  not_a_product:"That doesn't look like a beauty product. Try a clear photo of the front label ✨",
  no_api_key:"Photo check needs an API key in your .env file 🔑",
  no_images:"Add a photo first 📸", too_many_images:"Max 4 photos at a time please 🌸",
  bad_image:"That file doesn't look like a JPG/PNG/WEBP image.", image_too_large:"That photo is too large – try a smaller one.",
  too_large:"Those photos are too big all together.", llm_failed:"The AI service had a hiccup. Try again in a moment 💗",
  unreadable:"I couldn't read that label – try a clearer, closer photo ✨", empty_query:"Tell me what you're looking for 💕"
};
const REVIEW_STATUS = {
  no_serper_key:"I read the product, but there's no SERPER_API_KEY in your .env, so I can't fetch reviews 🔑",
  serper_error:"I read the product, but the review search failed just now. Try again in a moment 💗",
  no_results:"I read the product, but couldn't find shop listings with reviews for it 🥺",
  no_query:"I couldn't read a brand or product name clearly, so I can't look up reviews. Try a closer photo ✨"
};
const $ = s => document.querySelector(s);
const el = (cls, html) => { const d = document.createElement("div"); d.className = cls; if (html != null) d.innerHTML = html; return d; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs = n => "₹" + Number(n).toLocaleString("en-IN");
const KEY = "glow_chats_v1";

let chats = []; try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
let curId = null, busy = false, files = [];
const cur = () => chats.find(c => c.id === curId);
function save() {
  while (true) {
    try { localStorage.setItem(KEY, JSON.stringify(chats)); return; }
    catch (e) { if (chats.length <= 1) return; chats.pop(); }      // storage full: drop the oldest chat
  }
}
function toast(t) { const x = $("#toast"); x.textContent = t; x.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove("show"), 1400); }

/* ---------- sparkles ---------- */
$("#sp").innerHTML = Array.from({length:14}, (_, i) => `<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${14+Math.random()*18}px;animation-delay:${-Math.random()*9}s">${["✨","💖","🌸","🎀","⭐","💗"][i%6]}</i>`).join("");

/* ---------- chats: create / switch / delete / search ---------- */
function newChat() {
  const c = cur();
  if (c && !c.msgs.length) { closeSide(); return renderAll(); }      // reuse the empty chat
  const n = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), title: "New chat", created: Date.now(), updated: Date.now(), msgs: []};
  chats.unshift(n); curId = n.id; save(); closeSide(); renderAll(); $("#q").focus();
}
function openChat(id) { curId = id; closeSide(); renderAll(); }
function deleteChat(id) {
  const c = chats.find(x => x.id === id); if (!c) return;
  if (!confirm(`Delete "${c.title}"? This can't be undone.`)) return;
  chats = chats.filter(x => x.id !== id); save();
  if (curId === id) { curId = chats[0]?.id || null; if (!curId) return newChat(); }
  renderAll();
}
function deleteAll() { if (!chats.length || !confirm("Delete ALL chats? This can't be undone.")) return; chats = []; curId = null; save(); newChat(); }
function snippet(text, term) {
  const i = text.toLowerCase().indexOf(term); if (i < 0) return "";
  const a = Math.max(0, i - 22), b = Math.min(text.length, i + term.length + 28);
  return (a ? "…" : "") + esc(text.slice(a, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length, b)) + (b < text.length ? "…" : "");
}
function renderList() {
  const term = $("#cs").value.trim().toLowerCase();
  const rows = [...chats].sort((a, b) => b.updated - a.updated).map(c => {
    if (!term) return {c, snip: ""};
    if (c.title.toLowerCase().includes(term)) return {c, snip: ""};
    const m = c.msgs.find(m => (m.text || "").toLowerCase().includes(term));
    return m ? {c, snip: snippet(m.text, term)} : null;
  }).filter(Boolean);
  $("#clist").innerHTML = rows.length ? rows.map(({c, snip}) => `
    <div class="ci ${c.id === curId ? "on" : ""}" data-id="${c.id}">
      <div class="t"><b>${term ? snippet(c.title, term) || esc(c.title) : esc(c.title)}</b>
        <small>${snip || new Date(c.updated).toLocaleDateString("en-IN", {day:"numeric", month:"short"}) + " · " + c.msgs.filter(m => m.role === "user").length + " msg"}</small></div>
      <button class="del" data-del="${c.id}" title="Delete chat">🗑️</button></div>`).join("")
    : `<div class="empty">${term ? "No chats found 🥺" : "No chats yet 💕"}</div>`;
}
$("#clist").onclick = e => {
  const d = e.target.closest("[data-del]"); if (d) return deleteChat(d.dataset.del);
  const c = e.target.closest("[data-id]"); if (c) openChat(c.dataset.id);
};
$("#cs").oninput = renderList;
$("#newc").onclick = newChat; $("#delall").onclick = deleteAll;
const closeSide = () => document.body.classList.remove("side-open");
$("#menu").onclick = () => document.body.classList.toggle("side-open");
$("#overlay").onclick = closeSide;

/* ---------- shop links ---------- */
const SHOPS = {
  Amazon: q => `https://www.amazon.in/s?k=${q}`,
  Flipkart: q => `https://www.flipkart.com/search?q=${q}`,
  Nykaa: q => `https://www.nykaa.com/search/result/?q=${q}&root=search&searchType=Manual`,
  Purplle: q => `https://www.purplle.com/search?q=${q}`,
  Tira: q => `https://www.tirabeauty.com/products/?q=${q}`,
  Myntra: q => `https://www.myntra.com/${q.replace(/%20/g, "-").toLowerCase()}?rawQuery=${q}`,
};
/* "Also look on" chips for big shops that have no review data for this product: opens that shop's own search */
function altLinks(brand, name, offers) {
  const have = new Set(offers.map(o => (o.platform || "").toLowerCase()));
  const words = (String(brand || "") + " " + String(name || "")).split(/\s+/).filter(Boolean).slice(0, 8).join(" ");
  const q = encodeURIComponent(words);
  const links = Object.entries(SHOPS).filter(([n]) => !have.has(n.toLowerCase()))
    .map(([n, f]) => `<a class="buy alt" target="_blank" rel="noopener noreferrer" href="${esc(f(q))}">${n}</a>`);
  return links.length ? `<div class="alts"><span class="muted">Also look on:</span> ${links.join("")}</div>` : "";
}

/* ---------- rendering ---------- */
function stars(r) { return `<span class="stars" style="--p:${Math.max(0, Math.min(100, r / 5 * 100))}%">★★★★★</span>`; }
function card(r) {
  const rows = r.offers.map((o, i) => `<tr class="o ${o.in_budget ? "" : "out"} ${i >= 8 ? "more" : ""}">
    <td><b>${esc(o.platform)}</b>${o.is_best ? '<span class="best">lowest in budget</span>' : ""}${o.in_budget ? "" : '<span class="over">over budget</span>'}</td><td>${rs(o.price)}</td>
    <td>${o.reviews ? stars(o.rating) + ` <span class="muted">${o.rating.toFixed(1)} · ${o.reviews.toLocaleString("en-IN")}</span>` : '<span class="muted">no rating on Google yet</span>'}</td>
    <td>${o.url ? `<a class="buy" target="_blank" rel="noopener noreferrer" href="${esc(o.url)}" title="Open on ${esc(o.platform)}">Shop ↗</a>` : ""}</td></tr>`).join("");
  const pc = (r.pros.length || r.cons.length) ? `<div class="pc">
    <div class="pro"><b>💚 Pros</b><ul>${r.pros.map(x => `<li>${esc(x)}</li>`).join("") || "<li>–</li>"}</ul></div>
    <div class="con"><b>🧡 Cons</b><ul>${r.cons.map(x => `<li>${esc(x)}</li>`).join("") || "<li>–</li>"}</ul></div></div>${r.source === "live" ? '<div class="muted" style="margin-top:4px">✨ AI summary from the product details and its ratings, not quotes from reviews.</div>' : ""}` : "";
  return `<div class="card ${r.rank === 1 ? "first" : ""}"><div class="head">
    ${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
    <div><span class="rank ${r.rank === 1 ? "top" : ""}">${r.rank === 1 ? "👑 Top pick" : "#" + r.rank}</span>
    <h4>${esc(r.name)}</h4><div class="brand">${esc([r.brand, r.size, r.category].filter(Boolean).join(" · "))}</div></div></div>
    <div class="score"><span class="big">${r.review_score.toFixed(1)}</span>${stars(r.review_score)}
      <span class="muted">${r.total_reviews.toLocaleString("en-IN")} reviews · ${r.platform_count} platform${r.platform_count > 1 ? "s" : ""} with reviews${r.shop_count > r.platform_count ? " · sold on " + r.shop_count + " shops" : ""}</span></div>
    <div class="tags">${r.skin_types.map(s => `<span class="tag-s">${esc(s)}</span>`).join("")}${r.concerns.map(c => `<span class="tag-c">${esc(c)}</span>`).join("")}</div>
    <div class="tw"><table><tr><th>Platform</th><th>Price</th><th>Rating · reviews</th><th></th></tr>${rows}</table></div>${r.offers.length > 8 ? `<button class="mini" onclick="this.closest('.card').classList.toggle('all');this.textContent=this.closest('.card').classList.contains('all')?'Show fewer shops':'Show all ${r.offers.length} shops'">Show all ${r.offers.length} shops</button>` : ""}${altLinks(r.brand, r.name, r.offers)}${pc}
    <ul class="why">${r.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

/* photo-scan result: matches what glow_sleuth/scan.py returns {product, reviews, ...} */
function scanHtml(d) {
  const p = d.product || {}, rv = d.reviews || {}, pooled = rv.pooled, offers = rv.offers || [];
  const title = [p.brand, p.name].filter(Boolean).join(" ") || "Unknown product";
  const meta = [p.size, p.category].filter(Boolean).join(" · ");
  const skin = Array.isArray(p.skin_types) ? p.skin_types : [], ing = Array.isArray(p.ingredients) ? p.ingredients : [];
  const pros = Array.isArray(p.pros) ? p.pros : [], cons = Array.isArray(p.cons) ? p.cons : [];

  let h = `<div class="card first"><span class="rank top">📸 Photo check</span><h4>${esc(title)}</h4>`;
  if (meta) h += `<div class="brand">${esc(meta)}</div>`;
  if (p.summary) h += `<p class="muted">${esc(p.summary)}</p>`;
  if (Number(p.confidence) > 0 && Number(p.confidence) < 0.5) h += `<p class="muted">🔎 I'm not fully sure about the name. A closer photo of the front label helps.</p>`;
  if (skin.length || ing.length)
    h += `<div class="tags">${skin.map(s => `<span class="tag-s">${esc(s)}</span>`).join("")}${ing.map(x => `<span class="tag-c">${esc(x)}</span>`).join("")}</div>`;

  if (pooled) {
    h += `<div class="score"><span class="big">${Number(pooled.score).toFixed(1)}</span>${stars(pooled.score)}
      <span class="muted">${Number(pooled.total_reviews).toLocaleString("en-IN")} reviews · ${pooled.platforms} platform${pooled.platforms > 1 ? "s" : ""}</span></div>`;
  } else {
    h += `<p class="muted">${esc(REVIEW_STATUS[rv.status] || "No review data found for this product.")}</p>`;
  }

  if (offers.length) {
    const rows = offers.slice(0, 8).map(o => `<tr class="o">
      <td><b>${esc(o.platform || "Shop")}</b></td><td>${o.price != null ? rs(o.price) : "–"}</td>
      <td>${o.rating ? stars(o.rating) + ` <span class="muted">${Number(o.rating).toFixed(1)} · ${Number(o.reviews || 0).toLocaleString("en-IN")}</span>` : '<span class="muted">no reviews</span>'}</td>
      <td>${o.url ? `<a class="buy" target="_blank" rel="noopener noreferrer" href="${esc(o.url)}" title="Open on ${esc(o.platform)}">Shop ↗</a>` : ""}</td></tr>`).join("");
    h += `<div class="tw"><table><tr><th>Platform</th><th>Price</th><th>Rating · reviews</th><th></th></tr>${rows}</table></div>`;
  }
  h += altLinks(p.brand, p.name, offers);
  if (pros.length || cons.length) h += `<div class="pc">
    <div class="pro"><b>💚 Good points</b><ul>${pros.map(x => `<li>${esc(x)}</li>`).join("") || "<li>–</li>"}</ul></div>
    <div class="con"><b>🧡 Heads-up</b><ul>${cons.map(x => `<li>${esc(x)}</li>`).join("") || "<li>–</li>"}</ul></div></div>`;
  if (rv.query) h += `<p class="muted">Searched Google Shopping for “${esc(rv.query)}”. Check the label for your skin type.</p>`;
  return h + `</div>`;
}

function msgEl(m, i) {
  if (m.role === "user") {
    const d = el("msg me");
    d.dataset.i = i;
    d.innerHTML = `<div class="ubub">${(m.thumbs && m.thumbs.length) ? `<div class="thumbs">${m.thumbs.map(t => `<img src="${t}" alt="your photo" data-zoom="1">`).join("")}</div>` : ""}${m.photos ? `<div class="ph">📸 ${m.photos} photo${m.photos > 1 ? "s" : ""}</div>` : ""}${esc(m.text)}</div>
      <div class="acts"><button data-act="copy" title="Copy text">📋 Copy</button>${m.photos ? "" : '<button data-act="edit" title="Edit & resend">✏️ Edit</button>'}</div>`;
    return d;
  }
  return el("msg bot", m.bare ? m.html : `<div class="bubble">${m.html}</div>`);
}
function renderChat() {
  const c = cur(), box = $("#chat"); box.innerHTML = "";
  box.appendChild(el("msg bot", `<div class="bubble">HEYY,GIRL! 🎀<br>What's the beauty mood today, bestie? Are we finding your next skincare obsession, the perfect lipstick, dreamy haircare or a little glow-up magic?</div>`));
  c.msgs.forEach((m, i) => box.appendChild(msgEl(m, i)));
  if (busy && busyChat === c.id) box.appendChild(el("msg bot", `<div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>`));
  box.scrollTop = box.scrollHeight;
}
const renderAll = () => { renderChat(); renderList(); };

/* ---------- copy & edit on your own messages ---------- */
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); } catch (_) {} a.remove(); }
  toast("Copied 💕");
}
function startEdit(node, i) {
  const m = cur().msgs[i]; node.classList.add("editing");
  node.innerHTML = `<textarea class="edit" rows="2">${esc(m.text)}</textarea>
    <div class="acts"><button data-act="save">💌 Save &amp; resend</button><button data-act="cancel">Cancel</button></div>`;
  const t = node.querySelector("textarea"); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
}
async function saveEdit(i, text) {
  if (busy) return toast("Wait for the reply first 🌸");
  text = text.trim(); if (!text) return;
  const c = cur(); c.msgs.length = i; c.msgs.push({role: "user", text});     // later messages belonged to the old question
  if (i === 0) c.title = text.slice(0, 40);
  c.updated = Date.now(); save(); renderAll(); await runQuery(c, text);
}
$("#chat").onclick = e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const node = b.closest(".msg.me"), i = +node.dataset.i, act = b.dataset.act;
  if (act === "copy") copyText(cur().msgs[i].text);
  else if (act === "edit") startEdit(node, i);
  else if (act === "cancel") renderChat();
  else if (act === "save") saveEdit(i, node.querySelector("textarea").value);
};
$("#chat").addEventListener("keydown", e => {
  if (e.target.matches("textarea.edit") && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveEdit(+e.target.closest(".msg.me").dataset.i, e.target.value); }
});

/* ---------- talking to the server ---------- */
let busyChat = null;
const NO_SERVER = "Can't reach the server 😿 Is <code>python app.py</code> still running? Open the app at <b>http://127.0.0.1:5000</b>.";
function pushBot(c, html, text, bare) { c.msgs.push({role: "bot", html, text: text || "", bare: !!bare}); c.updated = Date.now(); }
async function finish(c) { busy = false; busyChat = null; save(); if (curId === c.id) renderChat(); renderList(); $("#go").classList.remove("busy"); }
function start(c) { busy = true; busyChat = c.id; $("#go").classList.add("busy"); renderChat(); }

/* fetch + parse JSON; only a real network failure counts as "can't reach the server" */
async function post(url, opts) {
  let res;
  try { res = await fetch(url, opts); } catch (e) { return {netfail: true}; }
  let d = {};
  try { d = await res.json(); } catch (e) { d = {code: "ai_error"}; }
  return {res, d};
}

async function runQuery(c, q) {
  start(c);
  try {
    const {res, d, netfail} = await post("/api/recommend", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({query: q})});
    if (netfail) return pushBot(c, NO_SERVER, "server error");
    if (!res.ok) return pushBot(c, esc(ERR[d.code] || "Something went wrong 🥺"), "error");
    const trace = `<details class="trace"><summary>🔍 How I searched</summary><ul>${d.trace.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>`;
    if (d.data === "live_error" && !d.count) return pushBot(c, `Oh no, I couldn't fetch live products 😿<br><b>${esc(d.error)}</b><br>Run <code>python check_serper.py</code> in the terminal to test your key, then restart the server.`, "live search failed");
    const src = d.data === "live" ? `<div class="muted">🌐 Live prices &amp; reviews from Google Shopping</div>`
      : d.data === "demo" ? `<div class="muted">🧪 Demo data (fictional), because no SERPER_API_KEY was found. Put it in the .env file next to app.py and restart the server.</div>` : "";
    if (!d.count) return pushBot(c, `Aw, nothing matched <b>${esc(d.summary)}</b> 🥺<br>Try a higher budget, a different skin type, or fewer filters.${trace}`, "nothing matched " + d.summary);
    pushBot(c, `Found <b>${d.count}</b> match${d.count > 1 ? "es" : ""} for <b>${esc(d.summary)}</b> 💕 Showing all of them, best reviews first!${src}${trace}`, `Found ${d.count} matches for ${d.summary}`);
    pushBot(c, d.recs.map(card).join(""), d.recs.map(r => `${r.brand} ${r.name}`).join(" · "), true);
  } catch (e) { console.error(e); pushBot(c, "I got the answer but couldn't display it 🥺 (details are in the browser console, F12).", "display error"); }
  finally { await finish(c); }
}

async function runScan(c, note, photos) {
  start(c);
  try {
    const fd = new FormData(); photos.forEach(f => fd.append("images", f)); fd.append("note", note || ""); fd.append("profile", "{}");
    const {res, d, netfail} = await post("/api/scan", {method: "POST", body: fd});
    if (netfail) return pushBot(c, NO_SERVER, "server error");
    if (!res.ok) return pushBot(c, esc(ERR[d.code] || "Something went wrong 🥺"), "error");
    const p = d.product || {};
    pushBot(c, scanHtml(d), [p.brand, p.name, p.summary].filter(Boolean).join(" "), true);
  } catch (e) { console.error(e); pushBot(c, "I scanned the photo but couldn't display the result 🥺 (details are in the browser console, F12).", "display error"); }
  finally { await finish(c); }
}

/* ---------- photo thumbnails (small copies, so they survive in localStorage) ---------- */
function makeThumb(file, max = 360) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.75));
      } catch (e) { resolve(""); }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };     // e.g. HEIC the browser can't draw
    img.src = url;
  });
}
$("#chat").addEventListener("click", e => {
  const im = e.target.closest("img[data-zoom]"); if (!im) return;
  const w = window.open(); if (w) { w.document.title = "Your photo"; w.document.body.style.cssText = "margin:0;background:#222;display:flex;align-items:center;justify-content:center;height:100vh"; w.document.body.innerHTML = `<img src="${im.src}" style="max-width:100%;max-height:100%">`; }
});

/* ---------- composer ---------- */
$("#cam").onclick = () => $("#file").click();
$("#file").onchange = e => { files = [...files, ...e.target.files].slice(0, 4); e.target.value = ""; drawPreview(); };
function drawPreview() {
  $("#preview").innerHTML = "";
  files.forEach((f, i) => { const d = el("pv", `<img src="${URL.createObjectURL(f)}" alt=""><button data-i="${i}">✕</button>`); $("#preview").appendChild(d); });
}
$("#preview").onclick = e => { const b = e.target.closest("[data-i]"); if (b) { files.splice(+b.dataset.i, 1); drawPreview(); } };

async function send() {
  if (busy) return toast("One sec, still searching 🌸");
  const q = $("#q").value.trim(); if (!q && !files.length) return;
  const c = cur(), photos = files;
  const thumbs = (await Promise.all(photos.map(f => makeThumb(f)))).filter(Boolean);
  c.msgs.push({role: "user", text: q || "Check this product", photos: photos.length, thumbs});
  if (c.msgs.filter(m => m.role === "user").length === 1) c.title = (q || "Photo check 📸").slice(0, 40);
  c.updated = Date.now(); save();
  $("#q").value = ""; files = []; drawPreview();
  photos.length ? await runScan(c, q, photos) : await runQuery(c, q);
}
$("#go").onclick = send;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* ---------- start ---------- */
if (!chats.length) newChat(); else { curId = chats.sort((a, b) => b.updated - a.updated)[0].id; renderAll(); }
</script>
